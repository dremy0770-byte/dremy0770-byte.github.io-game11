<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이투잡의 하루</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+KR:wght@400;700&display=swap');
:root {
  --bg:#0d0d1a; --panel:#131325; --panel2:#1a1a35; --border:#2a2a55;
  --accent:#7c6fff; --yellow:#ffe066; --green:#5effb1; --red:#ff6b6b;
  --text:#e8e6ff; --muted:#6666aa; --px:3px;
}
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated}
body{background:var(--bg);color:var(--text);font-family:'DotGothic16',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#game{width:100%;max-width:560px}
@keyframes crtOn{0%{transform:scaleY(0.01);opacity:.8}30%,100%{transform:scaleY(1);opacity:1}}
#game{animation:crtOn .5s ease-out}

/* 상태바 */
#statusbar{background:var(--panel);border:var(--px) solid var(--border);border-bottom:none;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);gap:6px;flex-wrap:wrap}
.sbar-left{display:flex;align-items:center;gap:8px}
.char-name{color:var(--yellow);font-size:12px}
.level-badge{background:var(--accent);color:white;font-size:9px;padding:1px 6px;border-radius:2px;letter-spacing:.05em}
.sbar-right{display:flex;align-items:center;gap:10px}
.stat{display:flex;align-items:center;gap:4px;font-size:10px}
.stat-bar{width:38px;height:5px;background:var(--panel2);border:1px solid var(--border);overflow:hidden}
.stat-fill{height:100%;background:var(--green);transition:width .4s ease}
.stat-fill.yellow{background:var(--yellow)}
.stat-fill.red{background:var(--red)}
#bgm-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:'DotGothic16',monospace;font-size:9px;padding:2px 6px;cursor:pointer;border-radius:2px;transition:all .1s}

/* 씬 */
#scene{background:var(--panel);border:var(--px) solid var(--border);height:200px;position:relative;overflow:hidden}
#scene::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,.1) 3px,rgba(0,0,0,.1) 4px);pointer-events:none;z-index:10}
#character{position:absolute;bottom:48px;left:50%;transform:translateX(-50%) translateX(-60px);font-size:34px;line-height:1;animation:idle 1.8s steps(1) infinite;z-index:5;filter:drop-shadow(0 0 8px rgba(124,111,255,.4))}
@keyframes idle{0%,80%{transform:translateX(-60px) translateX(-50%) translateY(0)}40%{transform:translateX(-60px) translateX(-50%) translateY(-2px)}}
#character.working{animation:work .6s steps(1) infinite}
@keyframes work{0%{transform:translateX(-60px) translateX(-50%) translateY(0)}50%{transform:translateX(-60px) translateX(-50%) translateY(-3px)}}
#event-text{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--accent);padding:3px 10px;font-size:10px;color:var(--yellow);white-space:nowrap;z-index:20;display:none}
#event-text.show{display:block}
#time-badge{position:absolute;top:8px;right:10px;font-size:9px;color:var(--muted);background:rgba(0,0,0,.5);padding:2px 6px;border:1px solid var(--border);z-index:15}
#visualizer{position:absolute;bottom:6px;right:8px;display:flex;gap:2px;align-items:flex-end;height:18px;z-index:6}
.viz-bar{width:3px;background:var(--accent);opacity:.5;animation:vizA .3s ease infinite alternate}
@keyframes vizA{to{height:3px}}

/* 배경 세트 */
.studio-bg{position:absolute;inset:0;background:linear-gradient(to bottom,#0d0d2e 0%,#131330 60%,#1a1040 100%)}
.studio-bg.day{background:linear-gradient(to bottom,#1a1a3e 0%,#12122a 100%)}
.town-bg{position:absolute;inset:0;background:linear-gradient(to bottom,#0a1a0a 0%,#0d2010 50%,#1a2a10 100%)}
.town-bg.day{background:linear-gradient(to bottom,#1a2a0a 0%,#203010 100%)}
.alba-bg{position:absolute;inset:0;background:linear-gradient(to bottom,#1a1000 0%,#251500 100%)}
.store-bg{position:absolute;inset:0;background:linear-gradient(to bottom,#001a2a 0%,#00253a 100%)}
.plaza-bg{position:absolute;inset:0;background:linear-gradient(to bottom,#0a0a2a 0%,#12102e 100%)}
.stars{position:absolute;inset:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:white;animation:twinkle 2s infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.moon{position:absolute;top:16px;right:28px;width:20px;height:20px;background:#ffe8a0;border-radius:50%;box-shadow:0 0 10px rgba(255,232,160,.4)}
.sun{position:absolute;top:16px;right:28px;width:20px;height:20px;background:#ffcc44;border-radius:50%;box-shadow:0 0 16px rgba(255,200,60,.6)}
.town-ground{position:absolute;bottom:0;left:0;right:0;height:34px;background:#1a3020;border-top:3px solid #2a4a30}
.town-ground.day{background:#2a4020;border-color:#3a5030}
.desk{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);width:190px;height:13px;background:#4a3728;border-top:3px solid #6b5040}
.monitor{position:absolute;bottom:51px;left:50%;transform:translateX(-50%);width:68px}
.monitor-screen{width:68px;height:44px;background:#0a0a1f;border:3px solid #555;border-bottom:none;overflow:hidden}
.monitor-inner{width:100%;height:100%;background:linear-gradient(135deg,#0a0a2e,#1a0a3e);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--accent);text-align:center;line-height:1.4;animation:flicker 4s infinite}
@keyframes flicker{0%,95%,100%{opacity:1}96%{opacity:.7}97%{opacity:1}98%{opacity:.8}}
.monitor-stand{width:18px;height:5px;background:#555;margin:0 auto}
.monitor-base{width:34px;height:4px;background:#444;margin:0 auto}
.keyboard{position:absolute;bottom:51px;left:calc(50% + 44px);width:48px;height:9px;background:#333;border:2px solid #555}
.building{position:absolute;bottom:34px;display:flex;flex-direction:column;align-items:center}
.building-body{background:#1a2a3a;border:2px solid #2a4a6a;position:relative}
.building-body.lit{border-color:#4a7aaa}
.bwin{position:absolute;width:7px;height:7px;background:#0a0a20;border:1px solid #333}
.bwin.on{background:var(--yellow);box-shadow:0 0 4px var(--yellow)}
.bwin.pon{background:var(--accent);box-shadow:0 0 4px var(--accent)}
.building-roof{width:0;height:0;border-left:solid transparent;border-right:solid transparent;border-bottom:solid #2a4a6a}
.sign{position:absolute;background:var(--panel);border:2px solid var(--border);padding:2px 5px;font-size:8px;color:var(--muted);white-space:nowrap;z-index:4}
.note{position:absolute;font-size:13px;animation:floatNote 2s ease-out forwards;pointer-events:none;z-index:6}
@keyframes floatNote{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px) rotate(20deg)}}
.conveyor{position:absolute;bottom:34px;left:0;right:0;height:11px;background:repeating-linear-gradient(90deg,#333 0px,#333 20px,#444 20px,#444 40px);border-top:3px solid #555;animation:convMove 1s linear infinite}
@keyframes convMove{to{background-position:40px 0}}
.w-shelf{position:absolute;left:20px;right:20px;height:9px;background:#4a3010;border-top:2px solid #6a5030}
.store-shelf{position:absolute;left:28px;right:28px;height:7px;background:#2a4a6a;border-top:2px solid #4a7aaa}
.fountain{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);font-size:22px;z-index:3}
.npc{position:absolute;font-size:22px;bottom:36px;animation:idle 2s steps(1) infinite;z-index:4}

/* 대화창 */
#dialogbox{background:var(--panel);border:var(--px) solid var(--border);border-top:none;min-height:68px;padding:10px 14px;position:relative}
#dialog-name{font-size:10px;color:var(--accent);margin-bottom:3px}
#dialog-text{font-size:12px;line-height:1.7;min-height:38px;color:var(--text)}
#dialog-cursor{display:inline-block;width:7px;height:11px;background:var(--text);margin-left:2px;animation:blink .7s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}

/* 메뉴 */
#menuarea{background:var(--panel2);border:var(--px) solid var(--border);border-top:none;padding:10px;max-height:200px;overflow-y:auto}
#menuarea::-webkit-scrollbar{width:3px}
#menuarea::-webkit-scrollbar-thumb{background:var(--border)}
#menu-title{font-size:9px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.menu-btn{background:var(--panel);border:var(--px) solid var(--border);color:var(--text);font-family:'DotGothic16',monospace;font-size:12px;padding:9px 12px;text-align:left;cursor:pointer;transition:background .1s,border-color .1s;display:flex;align-items:center;gap:6px}
.menu-btn::before{content:'▶';font-size:8px;color:var(--muted);flex-shrink:0}
.menu-btn:hover,.menu-btn:focus{background:var(--panel2);border-color:var(--accent);color:var(--yellow);outline:none}
.menu-btn:hover::before{color:var(--accent)}
.choice-list{display:flex;flex-direction:column;gap:5px}
.choice-btn{background:var(--panel);border:var(--px) solid var(--border);color:var(--text);font-family:'DotGothic16',monospace;font-size:12px;padding:8px 12px;text-align:left;cursor:pointer;transition:all .1s;display:flex;align-items:center;gap:8px}
.choice-btn::before{content:'○';color:var(--muted);font-size:9px}
.choice-btn:hover{border-color:var(--accent);color:var(--yellow);background:rgba(124,111,255,.08)}
.choice-btn:hover::before{content:'●';color:var(--accent)}
.result-card{background:var(--panel);border:var(--px) solid var(--accent);padding:12px 14px;font-size:12px;line-height:1.8}
.result-title{color:var(--yellow);margin-bottom:7px;font-size:11px}
.result-fans{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--muted);font-size:11px}
.fan-msg{color:var(--text);margin-top:3px}
.fan-rare{color:var(--green)}
.progress-wrap{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);margin:6px 0}
.progress-bar{flex:1;height:7px;background:var(--panel2);border:1px solid var(--border);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .05s}

/* 하단 크레딧 */
#footer{text-align:center;margin-top:8px;font-size:9px;color:var(--muted);letter-spacing:.12em;opacity:.6}
#footer span{color:var(--accent);opacity:.8}

/* 명예의 전당 / 디스코그래피 패널 */
.disco-list{display:flex;flex-direction:column;gap:5px;max-height:140px;overflow-y:auto}
.disco-item{background:var(--panel);border:1px solid var(--border);padding:7px 10px;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.disco-item .d-title{color:var(--text)}
.disco-item .d-meta{color:var(--muted);font-size:10px;text-align:right;flex-shrink:0}
.disco-item .d-rare{color:var(--green)}
.hall-card{background:var(--panel);border:2px solid var(--yellow);padding:18px;text-align:center;line-height:2}
.hall-card .hall-emoji{font-size:36px;display:block;margin-bottom:8px}
.hall-card .hall-title{color:var(--yellow);font-size:13px;margin-bottom:4px}
.hall-card .hall-stats{font-size:11px;color:var(--muted)}
.hall-card .hall-stat-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--border);font-size:11px}
.hall-card .hall-stat-row span:last-child{color:var(--text)}

/* 레벨업 팝업 */
#levelup-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:3px solid var(--yellow);padding:24px 32px;text-align:center;z-index:999;display:none;animation:popIn .3s ease}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.5)}100%{transform:translate(-50%,-50%) scale(1)}}
#levelup-popup .lv-emoji{font-size:40px;display:block;margin-bottom:8px}
#levelup-popup .lv-title{color:var(--yellow);font-size:14px;margin-bottom:4px}
#levelup-popup .lv-sub{color:var(--muted);font-size:11px;margin-bottom:14px}
#levelup-popup button{background:var(--accent);border:none;color:white;font-family:'DotGothic16',monospace;font-size:12px;padding:8px 20px;cursor:pointer;width:100%}

/* 일일 이벤트 배너 */
#daily-banner{background:rgba(124,111,255,.12);border:1px solid var(--accent);padding:8px 12px;font-size:11px;color:var(--text);margin-bottom:0;display:none;border-top:none}
#daily-banner .db-label{color:var(--accent);font-size:9px;margin-bottom:2px;letter-spacing:.1em}
</style>
</head>
<body>

<div id="game">
  <div id="statusbar">
    <div class="sbar-left">
      <span class="char-name" id="char-display">😾 이투잡</span>
      <span class="level-badge" id="level-badge">Lv1</span>
      <span style="font-size:9px;color:var(--muted)" id="day-display">Day 1</span>
    </div>
    <div class="sbar-right">
      <div class="stat"><span>🐟</span><div class="stat-bar"><div class="stat-fill yellow" id="bar-tuna" style="width:60%"></div></div></div>
      <div class="stat"><span>💜</span><div class="stat-bar"><div class="stat-fill" id="bar-spirit" style="width:80%"></div></div></div>
      <div class="stat"><span>🎵</span><div class="stat-bar"><div class="stat-fill" id="bar-music" style="width:40%"></div></div></div>
      <button id="bgm-btn" onclick="toggleBGM()">🎵</button>
    </div>
  </div>
  <div id="daily-banner"><div class="db-label">▷ TODAY'S EVENT</div><div id="daily-text"></div></div>
  <div id="scene">
    <div id="time-badge">🌙 새벽</div>
    <div id="event-text"></div>
    <div id="character">🎧</div>
    <div id="visualizer">
      <div class="viz-bar" style="height:11px;animation-delay:0s"></div>
      <div class="viz-bar" style="height:17px;animation-delay:.1s"></div>
      <div class="viz-bar" style="height:7px;animation-delay:.2s"></div>
      <div class="viz-bar" style="height:14px;animation-delay:.05s"></div>
      <div class="viz-bar" style="height:19px;animation-delay:.15s"></div>
      <div class="viz-bar" style="height:9px;animation-delay:.25s"></div>
    </div>
  </div>
  <div id="dialogbox">
    <div id="dialog-name">이투잡</div>
    <div id="dialog-text">새벽 2시다. 오늘도 작업실이다.<span id="dialog-cursor"></span></div>
  </div>
  <div id="menuarea">
    <div id="menu-title">▷ 어떻게 할까?</div>
    <div id="menu-content"></div>
  </div>
</div>
<div id="footer">made with 🎹 by <span>sookyeong</span> &nbsp;·&nbsp; 구르르엔터</div>

<!-- 레벨업 팝업 -->
<div id="levelup-popup">
  <span class="lv-emoji" id="lv-emoji">⭐</span>
  <div class="lv-title" id="lv-title">레벨 업!</div>
  <div class="lv-sub" id="lv-sub">신인 뮤지션</div>
  <button onclick="closeLevelup()">▶ 계속하기</button>
</div>

<script>
// ══════════════════════════════
// 💾 SAVE / LOAD
// ══════════════════════════════
const SAVE_KEY = 'toojab_save_v1';

function saveGame() {
  const data = {
    tuna: state.tuna, spirit: state.spirit, music: state.music,
    day: state.day, xp: state.xp, level: state.level,
    discography: state.discography, time: state.time,
    todayEventDone: state.todayEventDone,
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    state.tuna    = d.tuna    ?? 60;
    state.spirit  = d.spirit  ?? 80;
    state.music   = d.music   ?? 40;
    state.day     = d.day     ?? 1;
    state.xp      = d.xp     ?? 0;
    state.level   = d.level  ?? 1;
    state.discography = d.discography ?? [];
    state.time    = d.time   ?? 'night';
    state.todayEventDone = d.todayEventDone ?? false;
    return true;
  } catch(e) { return false; }
}

// ══════════════════════════════
// 🎮 STATE
// ══════════════════════════════
const state = {
  tuna: 60, spirit: 80, music: 40,
  day: 1, xp: 0, level: 1,
  discography: [],   // [{title, genre, day, rare}]
  time: 'night',     // 'morning' | 'afternoon' | 'night'
  mood: null, genre: null,
  todayEventDone: false,
  dailyEvent: null,
};

// ── 레벨 정의 ──
const LEVELS = [
  { lv:1, name:'신인 뮤지션',         emoji:'😾', xp:0   },
  { lv:2, name:'인디 씬 입문',         emoji:'😼', xp:30  },
  { lv:3, name:'언더그라운드 존재감',  emoji:'😹', xp:80  },
  { lv:4, name:'헤드폰 고양이',        emoji:'🎧', xp:160 },
  { lv:5, name:'참치 걱정 없는 삶',   emoji:'✨', xp:300 },
];

function getLevelInfo() {
  for (let i = LEVELS.length-1; i >= 0; i--) {
    if (state.xp >= LEVELS[i].xp) return LEVELS[i];
  }
  return LEVELS[0];
}

function getNextLevel() {
  const cur = getLevelInfo();
  return LEVELS.find(l => l.lv === cur.lv + 1) || null;
}

function addXP(amount) {
  const before = getLevelInfo();
  state.xp += amount;
  const after = getLevelInfo();
  state.level = after.lv;
  if (after.lv > before.lv) showLevelUp(after);
  updateHUD();
  saveGame();
}

function showLevelUp(lvInfo) {
  if (audioCtx) sfxRare();
  document.getElementById('lv-emoji').textContent = lvInfo.emoji;
  document.getElementById('lv-title').textContent = `Lv${lvInfo.lv} 달성!`;
  document.getElementById('lv-sub').textContent = lvInfo.name;
  document.getElementById('levelup-popup').style.display = 'block';
}

function closeLevelup() {
  document.getElementById('levelup-popup').style.display = 'none';
}

// ── 시간대 ──
const TIME_INFO = {
  morning:   { label:'🌅 아침', bg:'day'  },
  afternoon: { label:'🌞 낮',   bg:'day'  },
  night:     { label:'🌙 새벽', bg:''     },
};

function advanceTime() {
  const order = ['morning','afternoon','night'];
  const i = order.indexOf(state.time);
  state.time = order[(i+1) % 3];
  if (state.time === 'morning') {
    state.day++;
    state.todayEventDone = false;
    rollDailyEvent();
  }
  saveGame();
  updateHUD();
}

// ── 일일 이벤트 풀 ──
const DAILY_EVENTS = [
  { text:'오늘 Splice 세일! 샘플 사도 참치 안 까먹음 🎁', bonus: () => { state.tuna = Math.min(100, state.tuna+10); } },
  { text:'팬이 커버곡 올렸다. 정신력 회복 💜', bonus: () => { state.spirit = Math.min(100, state.spirit+20); } },
  { text:'알바 자리 바뀜. 참치 라인 담당이 됨 🐟', bonus: () => { state.tuna = Math.min(100, state.tuna+15); } },
  { text:'플러그인 업데이트가 떴다. 오늘 작업이 잘 될 것 같다 🔌', bonus: () => { state.music = Math.min(100, state.music+15); } },
  { text:'옆 동네 고양이가 인스타에 내 곡 태그했다 😹', bonus: () => { addXP(5); } },
  { text:'오늘따라 커피가 맛있다. 이유는 모름 ☕', bonus: () => { state.spirit = Math.min(100, state.spirit+10); } },
  { text:'박스에서 참치캔 하나 발견. 주운 거 아님 🐟', bonus: () => { state.tuna = Math.min(100, state.tuna+8); } },
  { text:'DAW 업데이트 후 이상하게 더 잘 굴러간다 🎹', bonus: () => { state.music = Math.min(100, state.music+10); } },
];

function rollDailyEvent() {
  state.dailyEvent = DAILY_EVENTS[Math.floor(Math.random() * DAILY_EVENTS.length)];
}

function showDailyBanner() {
  if (!state.dailyEvent || state.todayEventDone) return;
  document.getElementById('daily-text').textContent = state.dailyEvent.text;
  document.getElementById('daily-banner').style.display = 'block';
}

function claimDailyEvent() {
  if (!state.dailyEvent || state.todayEventDone) return;
  state.dailyEvent.bonus();
  state.todayEventDone = true;
  document.getElementById('daily-banner').style.display = 'none';
  updateBars();
  saveGame();
}

// ── 표정 업데이트 ──
function getFace() {
  if (state.spirit < 25) return '😿';
  if (state.spirit > 85 && state.tuna > 70) return '😸';
  const lvInfo = getLevelInfo();
  return lvInfo.emoji;
}

// ══════════════════════════════
// 🖥 HUD 업데이트
// ══════════════════════════════
function updateHUD() {
  const lvInfo = getLevelInfo();
  const next   = getNextLevel();

function setDialog(name, text) {
  document.getElementById('dialog-name').textContent = name;
  document.getElementById('dialog-text').innerHTML   = text + '<span id="dialog-cursor"></span>';
}

function showEvent(msg) {
  const el = document.getElementById('event-text');
  el.textContent = msg;
  el.style.display = 'block';
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => { el.style.display='none'; }, 2500);
  if (audioCtx && bgmPlaying) sfxEvent();
}

function spawnNote(e) {
  const scene = document.getElementById('scene');
  const n = document.createElement('div');
  n.className = 'note'; n.textContent = e;
  n.style.left = (Math.random()*60+80)+'px'; n.style.bottom = '65px';
  scene.appendChild(n);
  setTimeout(() => n.remove(), 2000);
}

function setWorking(on) {

function setMonitor(text) {

}

// 📋 MENU RENDER
// ══════════════════════════════
function renderMenu(items) {
  const el = document.getElementById('menu-content');
  el.innerHTML = '';
  if (items.type === 'grid') {
    const g = document.createElement('div'); g.className = 'menu-grid';
    items.options.forEach(o => {
      const b = document.createElement('button'); b.className='menu-btn';
      b.textContent=o.label; b.onclick=o.action; g.appendChild(b);
    });
    el.appendChild(g);
  } else if (items.type === 'choice') {
    const l = document.createElement('div'); l.className='choice-list';
    items.options.forEach(o => {
      const b = document.createElement('button'); b.className='choice-btn';
      b.textContent=o.label; b.onclick=o.action; l.appendChild(b);
    });
    el.appendChild(l);
  } else if (items.type === 'result') {
    const c = document.createElement('div'); c.className='result-card';
    c.innerHTML = items.html; el.appendChild(c);
  } else if (items.type === 'progress') {
    const w = document.createElement('div');
    w.innerHTML=`<div style="font-size:12px;margin-bottom:7px;color:var(--text)">${items.label}</div>
    <div class="progress-wrap"><span>${items.sublabel}</span>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    <span id="prog-pct">0%</span></div>`;
    el.appendChild(w);
    let pct=0;
    const fill=w.querySelector('#prog-fill'), pctEl=w.querySelector('#prog-pct');
    const iv=setInterval(()=>{
      pct+=2; fill.style.width=pct+'%'; pctEl.textContent=pct+'%';
      if(pct>=100){clearInterval(iv);setTimeout(items.done,300);}
    }, items.speed||40);
  } else if (items.type === 'disco') {
    const list = document.createElement('div'); list.className='disco-list';
    if (state.discography.length === 0) {
      list.innerHTML = '<div style="color:var(--muted);font-size:11px;padding:8px">아직 발매한 곡이 없다.</div>';
    } else {
      [...state.discography].reverse().forEach(t => {
        const d = document.createElement('div'); d.className='disco-item';
        d.innerHTML = `<span class="d-title${t.rare?' d-rare':''}">${t.rare?'✦ ':''}${t.title}</span>
        <span class="d-meta">${t.genre}<br>Day ${t.day}</span>`;
        list.appendChild(d);
      });
    }
    el.appendChild(list);
    const back = document.createElement('button');
    back.className='choice-btn'; back.style.marginTop='8px';
    back.textContent='← 돌아가기'; back.onclick=sceneMain;
    el.appendChild(back);
  } else if (items.type === 'hall') {
    const lvInfo = getLevelInfo();
    const next   = getNextLevel();
    const c = document.createElement('div'); c.className='hall-card';
    const xpToNext = next ? (next.xp - state.xp) : 0;
    c.innerHTML = `
      <span class="hall-emoji">${lvInfo.emoji}</span>
      <div class="hall-title">이투잡 — ${lvInfo.name}</div>
      <div class="hall-stats" style="margin:10px 0">
        <div class="hall-stat-row"><span>📅 플레이 일수</span><span>Day ${state.day}</span></div>
        <div class="hall-stat-row"><span>🎵 발매곡</span><span>${state.discography.length}곡</span></div>
        <div class="hall-stat-row"><span>⭐ 경험치</span><span>${state.xp} XP</span></div>
        <div class="hall-stat-row"><span>🐟 현재 참치</span><span>${state.tuna}%</span></div>
        ${next ? `<div class="hall-stat-row"><span>다음 레벨까지</span><span>${xpToNext} XP</span></div>` : '<div class="hall-stat-row"><span>🏆 최고 등급 달성!</span><span>✨</span></div>'}
      </div>
    `;
    el.appendChild(c);
    const back = document.createElement('button');
    back.className='choice-btn'; back.style.marginTop='8px';
    back.textContent='← 돌아가기'; back.onclick=sceneMain;
    el.appendChild(back);
  }
}

      claimDailyEvent(); showEvent('✦ 오늘의 이벤트 획득!'); sceneMain();

  }
}

function chooseMood(genre) {
  const labels = {
    ballad:['감성 발라드','🎹','새벽 감성 넘침'],
    rock:  ['락','🎸','어딘가 폭발적'],
    dino:  ['공룡메탈','🦖','왜인지 모르겠지만 확신이 생김'],
    city:  ['시티팝','🌊','참치향이 나는 것 같기도'],
  };
  const [name,emoji,desc]=labels[genre];
  state.mood=name; state.genre=genre;
  setDialog('이투잡',`${emoji} ${name}… ${desc}.\n다음은 샘플 고르기.`);
  renderMenu({ type:'choice', options:[
    { label:'🥁 드럼 — 808',       action:()=>chooseSample('808')    },
    { label:'🎷 브라스 — Splice산', action:()=>chooseSample('brass')  },
    { label:'🎻 스트링 — 직접 연주', action:()=>chooseSample('string') },
  ]});
}

function chooseSample(sample) {
  const evs=[null,null,null,'noise','missing','unsaved'];
  const ev=evs[Math.floor(Math.random()*evs.length)];
  if(ev==='noise') sceneNoise(sample);
  else if(ev==='missing') sceneMissingSample(sample);
  else if(ev==='unsaved') sceneUnsaved(sample);
  else sceneCompose(sample);
}

    <div class="result-fans">정신력 +30 ✦ XP +15 ✦ 오늘 살았다</div>`;

    <div class="fan-msg">😺 "잘 듣겠습니다"</div>

// ══════════════════════════════
// 🎵 AUDIO ENGINE
// ══════════════════════════════
let audioCtx=null, bgmPlaying=false, bgmNodes={}, masterGain=null;

function initAudio() {
  if(audioCtx) return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain(); masterGain.gain.value=0.45;
  masterGain.connect(audioCtx.destination);
}

function sfxPop() {
  if(!audioCtx) return;
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.connect(g); g.connect(masterGain); osc.type='sine';
  const t=audioCtx.currentTime;
  osc.frequency.setValueAtTime(520,t); osc.frequency.exponentialRampToValueAtTime(280,t+.07);
  g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.1);
  osc.start(t); osc.stop(t+.1);
}

function sfxEvent() {
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  [660,880].forEach((f,i)=>{
    const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
    osc.connect(g);g.connect(masterGain);osc.type='square';osc.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*.1);g.gain.linearRampToValueAtTime(.07,t+i*.1+.01);
    g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.18);
    osc.start(t+i*.1);osc.stop(t+i*.1+.2);
  });
}

function sfxRare() {
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  [523,659,784,1047].forEach((f,i)=>{
    const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
    osc.connect(g);g.connect(masterGain);osc.type='triangle';osc.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.11,t+i*.12+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.35);
    osc.start(t+i*.12);osc.stop(t+i*.12+.4);
  });
}

function sfxLevelUp() {
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  [392,523,659,784,1047].forEach((f,i)=>{
    const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
    osc.connect(g);g.connect(masterGain);osc.type='square';osc.frequency.value=f;
    g.gain.setValueAtTime(0,t+i*.1);g.gain.linearRampToValueAtTime(.09,t+i*.1+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.4);
    osc.start(t+i*.1);osc.stop(t+i*.1+.45);
  });
}

function startBGM() {
  if(!audioCtx||bgmPlaying) return;
  bgmPlaying=true;
  const BPM=80, beat=60/BPM, bar=beat*4;

  // vinyl crackle
  const bLen=audioCtx.sampleRate*2;
  const nBuf=audioCtx.createBuffer(1,bLen,audioCtx.sampleRate);
  const nd=nBuf.getChannelData(0);
  for(let i=0;i<bLen;i++) nd[i]=(Math.random()*2-1)*.011;
  const nSrc=audioCtx.createBufferSource(); nSrc.buffer=nBuf; nSrc.loop=true;
  const nFilt=audioCtx.createBiquadFilter(); nFilt.type='lowpass'; nFilt.frequency.value=800;
  const nGain=audioCtx.createGain(); nGain.gain.value=.055;
  nSrc.connect(nFilt);nFilt.connect(nGain);nGain.connect(masterGain); nSrc.start();
  bgmNodes.noise=nSrc;

  function kick(t){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(masterGain);
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.2);
    g.gain.setValueAtTime(.28,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
    o.start(t);o.stop(t+.3);
  }
  function snare(t){
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.12,audioCtx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=audioCtx.createBufferSource(); s.buffer=buf;
    const f=audioCtx.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800;
    const g=audioCtx.createGain(); s.connect(f);f.connect(g);g.connect(masterGain);
    g.gain.setValueAtTime(.11,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
    s.start(t);s.stop(t+.13);
  }
  function hihat(t,open){
    const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.05,audioCtx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=audioCtx.createBufferSource(); s.buffer=buf;
    const f=audioCtx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
    const g=audioCtx.createGain(); s.connect(f);f.connect(g);g.connect(masterGain);
    g.gain.setValueAtTime(open?.065:.038,t);g.gain.exponentialRampToValueAtTime(.001,t+(open?.08:.03));
    s.start(t);s.stop(t+.1);
  }
  const chords=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
  function chord(freqs,t,dur){
    freqs.forEach(f=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),lpf=audioCtx.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=f; lpf.type='lowpass'; lpf.frequency.value=900;
      o.connect(lpf);lpf.connect(g);g.connect(masterGain);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.038,t+.08);
      g.gain.setValueAtTime(.038,t+dur-.1);g.gain.linearRampToValueAtTime(0,t+dur);
      o.start(t);o.stop(t+dur+.05);
    });
  }
  const bassN=[110,87.3,130.8,98];
  function bass(f,t,dur){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),lpf=audioCtx.createBiquadFilter();
    o.type='sine'; o.frequency.value=f; lpf.type='lowpass'; lpf.frequency.value=300;
    o.connect(lpf);lpf.connect(g);g.connect(masterGain);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.17,t+.04);
    g.gain.setValueAtTime(.17,t+dur-.05);g.gain.linearRampToValueAtTime(0,t+dur);
    o.start(t);o.stop(t+dur+.05);
  }
  const melN=[440,392,349.2,329.6,293.7,261.6,220];
  function mel(t){
    const cnt=2+Math.floor(Math.random()*3);
    for(let i=0;i<cnt;i++){
      const f=melN[Math.floor(Math.random()*melN.length)];
      const off=i*beat*.5*(.8+Math.random()*.4), dur=beat*.3;
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='triangle'; o.frequency.value=f; o.connect(g);g.connect(masterGain);
      const tt=t+off;
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.065,tt+.02);
      g.gain.exponentialRampToValueAtTime(.001,tt+dur);
      o.start(tt);o.stop(tt+dur+.05);
    }
  }

  let lc=0, lt=null;
  function schedBar(){
    if(!bgmPlaying) return;
    const now=audioCtx.currentTime, ci=lc%4;
    chord(chords[ci],now,bar);
    bass(bassN[ci],now,beat*2); bass(bassN[ci]*1.5,now+beat*2,beat*1.5);
    kick(now); kick(now+beat*2);
    snare(now+beat); snare(now+beat*3);
    for(let i=0;i<8;i++) hihat(now+i*beat*.5,i%4===2);
    if(lc%2===0) mel(now+beat*.5);
    lc++; lt=setTimeout(schedBar,bar*1000-30);
  }
  schedBar();
  bgmNodes.stopLoop=()=>{ bgmPlaying=false; clearTimeout(lt); };
}

function stopBGM(){
  bgmPlaying=false;
  if(bgmNodes.noise){try{bgmNodes.noise.stop();}catch(e){}}
  if(bgmNodes.stopLoop) bgmNodes.stopLoop();
  bgmNodes={};
}

function toggleBGM(){
  initAudio();
  const btn=document.getElementById('bgm-btn');
  if(bgmPlaying){
    stopBGM(); btn.textContent='🔇'; btn.style.color='var(--muted)'; btn.style.borderColor='var(--border)';
  } else {
    startBGM(); btn.textContent='🎵'; btn.style.color='var(--green)'; btn.style.borderColor='var(--green)';
  }
}

// 첫 클릭 시 BGM 자동 시작
let bgmAutoStarted=false;
document.getElementById('menu-content').addEventListener('click',e=>{
  if(e.target.tagName==='BUTTON'){
    initAudio(); sfxPop();
    if(!bgmAutoStarted){
      bgmAutoStarted=true; startBGM();
      const btn=document.getElementById('bgm-btn');
      btn.textContent='🎵'; btn.style.color='var(--green)'; btn.style.borderColor='var(--green)';
    }
  }
});

// showEvent에 sfxEvent 연결
const _origSE=showEvent;
showEvent=function(msg){
  const el=document.getElementById('event-text');
  el.textContent=msg; el.style.display='block';

  if(audioCtx&&bgmPlaying) sfxEvent();
};
